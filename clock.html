<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
        }

        .timer-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #e4e4e4;
        }

        .input-section {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input {
            width: 70px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            outline: none;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .timer-display {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            color: #00adb5;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #start-btn {
            background-color: #00adb5;
            color: #fff;
        }

        #start-btn:hover {
            background-color: #00818a;
        }

        #pause-btn {
            background-color: #ff5722;
            color: #fff;
        }

        #pause-btn:hover {
            background-color: #e64a19;
        }

        #reset-btn {
            background-color: #393e46;
            color: #fff;
        }

        #reset-btn:hover {
            background-color: #222831;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <h1>Countdown Timer</h1>
        
        <!-- Input fields to set custom time -->
        <div class="input-section" id="input-section">
            <input type="number" id="minutes-input" placeholder="MM" min="0" max="99" value="05">
            <span style="font-size: 1.5rem; line-height: 40px;">:</span>
            <input type="number" id="seconds-input" placeholder="SS" min="0" max="59" value="00">
        </div>

        <!-- Timer Display -->
        <div class="timer-display" id="display">05:00</div>

        <!-- Control Buttons -->
        <div class="btn-group">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>

    <script>
        let countdown;
        let totalSeconds = 300; // Default 5 minutes
        let isRunning = false;

        const display = document.getElementById('display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const minutesInput = document.getElementById('minutes-input');
        const secondsInput = document.getElementById('seconds-input');
        const inputSection = document.getElementById('input-section');

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) return;

            // If starting fresh, grab values from the inputs
            if (totalSeconds === 0) {
                const mins = parseInt(minutesInput.value) || 0;
                const secs = parseInt(secondsInput.value) || 0;
                totalSeconds = (mins * 60) + secs;
            }

            if (totalSeconds <= 0) return;

            isRunning = true;
            inputSection.style.display = 'none'; // Hide inputs while running

            countdown = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    clearInterval(countdown);
                    isRunning = false;
                    alert("Time's up!");
                    inputSection.style.display = 'flex';
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(countdown);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            
            // Reset back to input values
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            totalSeconds = (mins * 60) + secs;
            
            updateDisplay();
            inputSection.style.display = 'flex';
        }

        // Sync inputs with display dynamically before starting
        function handleInput() {
            if (!isRunning) {
                const mins = parseInt(minutesInput.value) || 0;
                const secs = parseInt(secondsInput.value) || 0;
                totalSeconds = (mins * 60) + secs;
                updateDisplay();
            }
        }

        minutesInput.addEventListener('input', handleInput);
        secondsInput.addEventListener('input', handleInput);

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
